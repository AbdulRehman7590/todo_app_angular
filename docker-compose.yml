services:
  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      # Keeps Linux node_modules inside Docker so they never clash with the host.
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/data

volumes:
  frontend_node_modules:
